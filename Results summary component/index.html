<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results summary component</title>
    <link rel="icon"  type ="image/png" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="card">
        <div class="blue-part">
            <p class="top">Your Result</p>
            <div class="circle">
                <p class="number">76</p>
                <p>of 100</p>
            </div>
            <div class="text">
                <p class="middle">Great</p>
                <p class="bottom ">You scored higher than 65% of the people who have taken these tests.</p>
            </div>
            
        </div>
        <div class="white-part">
            <p class="align-left">Summary</p>
            <div class="rows">
                <div class="row red">
                    <div class="row-sub ">
                        <img src="./assets/images/icon-reaction.svg" alt="No reaction icon">
                        <p>Reaction</p>
                    </div>
                    <p class ="black">80<SPAN> / 100</SPAN></p>
                </div>

                <div class="row yellow">
                    <div class="row-sub">
                        <img src="./assets/images/icon-memory.svg" alt="No memory icon">
                        <p>Memory</p>
                    </div>
                    <p class="black">92<SPAN> / 100</SPAN></p>
                </div>

                <div class="row green">
                    <div class="row-sub">
                        <img src="./assets/images/icon-verbal.svg" alt="No verbal icon">
                        <p>Verbal</p>
                    </div>
                    <p class ="black">61<SPAN> / 100</SPAN></p>
                </div>

                <div class="row blue">
                    <div class="row-sub">
                        <img src="./assets/images/icon-visual.svg" alt="No visual icon">
                        <p>Visual</p>
                    </div>
                    <p class ="black">73<SPAN> / 100</SPAN></p>
                </div>
            
            </div>
            <a href="#" class="button">Continue</a>
        </div>
      
    </div>
    
</body>
</html>
