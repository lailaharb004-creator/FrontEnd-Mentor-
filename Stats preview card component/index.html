<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats preview card component</title>
    <link rel="icon" type="image/png" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <article class="card">
        <section class="left-side">
            <header>
                <p class="head">Get <span>insights</span> that help your business grow.</p>
                <p class="left-side-content">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>

            </header>
            <footer>
              <div>
                <p class="footer-number">10k+</p>
                <p class="footer-text">COMPANIES</p>
              </div>
              <div>
                <p class="footer-number">314</p>
                <p class="footer-text">TEMPLATES</p>
              </div>
              <div >
                <p class="footer-number">12M+</p>
                <p class="footer-text">QUERIES</p>
              </div>
            </footer>
        </section>
       
        <section class="right-side">
            <img src="./assets/images/image-header-desktop.jpg" alt="No Image Preview" class="header-img">
        </section>
    </article>
</body>
</html>
