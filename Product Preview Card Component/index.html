<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product preview card component</title>
    <link rel="icon" type="image/png" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
   <div class="card">
      <div class="image">
        
        <img src="./assets/images/image-product-desktop.jpg" alt="No Product Image Preview" class="showen">
      </div>
      <div class="content">
        <p>P E R F U M E</p>
        <p class="bold">Gabrielle Essence Eau De Parfum</p>
        <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
        <div class="price">
            <span class="colored">&dollar;148.99</span>
            <del>&dollar;169.99</del>
        </div>
        <div class="cart">
            <img src="./assets/images/icon-cart.svg" alt="No Cart Image Preview">
            <a href="#">Add To Cart</a>

        </div>
      </div>
   </div>
</body>
</html>
